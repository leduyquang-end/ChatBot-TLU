server {
    listen 80;
    server_name _;

    root /usr/share/nginx/html;
    index index.html;

    # DNS của Docker — resolve "backend" trễ, không fail khi backend chưa lên
    resolver 127.0.0.11 valid=10s ipv6=off;
    set $backend_url http://backend:8000;

    # Nén tĩnh
    gzip on;
    gzip_min_length 1024;
    gzip_types text/css application/javascript application/json image/svg+xml;

    # Header an toàn (không dùng inline script/style nên CSP chặt được)
    add_header X-Content-Type-Options "nosniff" always;
    add_header X-Frame-Options "DENY" always;
    add_header Referrer-Policy "no-referrer" always;
    add_header Content-Security-Policy "default-src 'self'; base-uri 'none'; form-action 'self'; frame-ancestors 'none'; object-src 'none'; script-src 'self'; style-src 'self'; img-src 'self' data:; connect-src 'self'; font-src 'self'" always;

    # Chuyển /api/* tới backend, bỏ tiền tố /api/
    # /api/auth/login -> http://backend:8000/auth/login
    location /api/ {
        # proxy_pass có biến không tự bỏ tiền tố như proxy_pass tĩnh,
        # nên rewrite tường minh trước khi chuyển tiếp.
        rewrite ^/api/(.*)$ /$1 break;
        proxy_pass $backend_url;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_read_timeout 300s;
        proxy_connect_timeout 5s;
    }

    # HTML luôn lấy bản mới (tránh dính bản cũ sau khi deploy)
    location = /index.html {
        expires -1;
        try_files $uri =404;
    }

    # Tài nguyên tĩnh cache ngắn
    location ~* \.(?:css|js)$ {
        expires 1h;
        try_files $uri =404;
    }

    # Trang chat là SPA một trang
    location / {
        try_files $uri $uri/ /index.html;
    }
}
