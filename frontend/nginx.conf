server {
    listen 80;
    server_name _;

    root /usr/share/nginx/html;
    index index.html;

    # DNS của Docker — resolve "backend" trễ, không fail khi backend chưa lên
    resolver 127.0.0.11 valid=10s ipv6=off;
    set $backend_url http://backend:8000;

    # Chuyển /api/* tới backend, bỏ tiền tố /api/
    # /api/auth/login -> http://backend:8000/auth/login
    location /api/ {
        rewrite ^/api/(.*)$ /$1 break;
        proxy_pass $backend_url;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_read_timeout 120s;
        proxy_connect_timeout 5s;
    }

    # Trang chat là SPA một trang
    location / {
        try_files $uri $uri/ /index.html;
    }
}
